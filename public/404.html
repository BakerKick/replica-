<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- No maximum-scale: pinch-zoom stays available. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — Shiraume Lodge</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@300;400&family=Work+Sans:wght@300;400&display=swap" rel="stylesheet">

<style>
/* Tokens lifted from the site so this page cannot drift from it. */
:root {
  --color-bg:           #f4f0e8;
  --color-surface:      #f7f4ed;
  --color-text:         #1e1c18;
  --color-text-muted:   #6b6860;
  --color-text-faint:   #b0aca2;
  --color-border:       #c5bfb0;
  --color-primary:      #3a6344;
  --color-primary-hover:#2a4f34;
  --color-text-inverse: #f5f2ec;
  --arch:               #bdb6a4;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body:    'Work Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-jp:      'Noto Serif JP', serif;
}
html.dark {
  --color-bg:           #15130f;
  --color-surface:      #1a1814;
  --color-text:         #e8e4db;
  --color-text-muted:   #8a8680;
  --color-text-faint:   #5a5750;
  --color-border:       #3a3730;
  --color-primary:      #7eaa8a;
  --color-primary-hover:#5a8c6a;
  --color-text-inverse: #1e1c18;
  --arch:               #55514a;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
  transition: background-color .4s ease, color .4s ease;
}

main {
  width: 100%;
  max-width: 34rem;
  text-align: center;
}

/* The katomado — the temple-window arch the site frames its photographs
   in. Empty here, with the code inside it: a window onto nothing. */
.window {
  position: relative;
  width: clamp(9rem, 34vw, 12.5rem);
  height: clamp(11rem, 42vw, 15.5rem);
  margin: 0 auto clamp(2rem, 5vw, 3rem);
}
.window svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  color: var(--arch);
}
.code {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 1.5rem;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: clamp(3.25rem, 12vw, 4.75rem);
  letter-spacing: 0.06em;
  color: var(--color-text-muted);
  user-select: none;
}

h1 {
  margin: 0 0 0.5rem;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(1.75rem, 5.5vw, 2.6rem);
  line-height: 1.2;
  letter-spacing: 0.01em;
}
.h-jp {
  margin: 0 0 clamp(1.25rem, 3.5vw, 1.75rem);
  font-family: var(--font-jp);
  font-weight: 300;
  font-size: clamp(0.95rem, 2.6vw, 1.1rem);
  color: var(--color-text-muted);
  letter-spacing: 0.08em;
}

.rule {
  width: 2.5rem;
  height: 1px;
  margin: 0 auto clamp(1.25rem, 3.5vw, 1.75rem);
  background: var(--color-border);
  border: 0;
}

p {
  margin: 0 auto 0.75rem;
  max-width: 26rem;
  font-size: 1rem;
  line-height: 1.75;
  color: var(--color-text-muted);
}
p.jp {
  font-family: var(--font-jp);
  font-size: 0.875rem;
  line-height: 1.9;
  color: var(--color-text-muted);
  margin-bottom: clamp(2rem, 5vw, 2.75rem);
}

.home {
  display: inline-block;
  padding: 0.85rem 2rem;
  background: var(--color-primary);
  color: var(--color-text-inverse);
  text-decoration: none;
  font-size: 0.9rem;
  letter-spacing: 0.05em;
  border-radius: 999px;
  transition: background-color .25s ease, transform .25s ease;
}
.home:hover, .home:focus-visible { background: var(--color-primary-hover); transform: translateY(-1px); }
.home:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; }

.mark {
  margin-top: clamp(2.5rem, 6vw, 3.5rem);
  font-family: var(--font-display);
  font-style: italic;
  font-size: 0.9rem;
  color: var(--color-text-muted);
  letter-spacing: 0.04em;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>

<main>
  <div class="window">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" fill="none" aria-hidden="true">
      <path pathLength="1"
            d="M0,100 L0,42 C1.5,26.07 11,16.66 25,11.95 C37.5,8.33 44,5.43 50,0 C56,5.43 62.5,8.33 75,11.95 C89,16.66 98.5,26.07 100,42 L100,100"
            stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="code">404</div>
  </div>

  <h1>This path leads nowhere</h1>
  <p class="h-jp">この道は続いていません</p>

  <hr class="rule">

  <p>The page you were looking for isn't here. It may have moved, or the link may be incomplete.</p>
  <p class="jp">お探しのページは見つかりませんでした。移動したか、リンクが正しくない可能性があります。</p>

  <a class="home" href="/">Return to the Lodge · 宿へ戻る</a>

  <p class="mark">Shiraume Lodge · 白梅</p>
</main>

<script>
// Match whatever mode the visitor last chose on the site, so arriving here
// is not a jarring flash of the other theme. Same key the main site writes.
// With no stored choice, follow the hour in Japan, as the site does.
(function () {
  var night;
  try { var saved = localStorage.getItem('shiraume-hero-mode');
        if (saved) night = saved === 'night'; } catch (e) {}
  if (night === undefined) {
    try {
      var h = parseInt(new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Tokyo', hour: '2-digit', hour12: false
      }).format(new Date()), 10);
      night = h >= 18 || h < 6;
    } catch (e) {
      night = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
  }
  if (night) document.documentElement.classList.add('dark');
})();
</script>

</body>
</html>
